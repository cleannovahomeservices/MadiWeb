<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reviews — Rosalina Massage</title>
  <style>

    :root{
      --bg:#ffffff;
      --card:#ffffff;
      --text:#0b0f14;
      --muted:#4b5563;
      --line: rgba(11,15,20,.12);
      --accent:#1aa6b8;      /* teal */
      --accent2:#1d6fd6;     /* blue */
      --accent3:#b96445;     /* warm rust */
      --shadow: 0 14px 36px rgba(11,15,20,.08);
      --radius: 22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background: var(--bg);
      min-height:100vh;
      overflow-x:hidden;
    }
    a{color:inherit}
    .container{max-width:1100px;margin:0 auto;padding:28px 20px 90px}
    header{
      position:sticky; top:0; z-index:20;
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,.92);
      border-bottom:1px solid var(--line);
    }
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;max-width:1100px;margin:0 auto}
    .brand{display:flex;align-items:center;gap:14px;min-width:260px}
    .brand img{height:52px;width:auto;display:block}
    .brand .name{display:flex;flex-direction:column;line-height:1.1}
    .brand .name strong{font-size:14px;letter-spacing:.3px}
    .brand .name span{font-size:12px;color:var(--muted)}
    nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    nav a{
      text-decoration:none;
      padding:9px 12px;
      border:1px solid transparent;
      border-radius:999px;
      color:var(--muted);
      font-size:13px;
      transition:all .2s ease;
    }
    nav a:hover{border-color:var(--line);color:var(--text);transform:translateY(-1px)}
    .lang{
      display:flex;align-items:center;gap:8px;
      padding:6px 8px;border:1px solid var(--line);border-radius:999px;
      background:rgba(255,255,255,.03);
    }
    .lang button{
      border:0;background:transparent;color:var(--muted);
      padding:7px 10px;border-radius:999px;cursor:pointer;font-size:12px;
      transition:all .18s ease;
    }
    .lang button[aria-pressed="true"]{
      color:#ffffff;
      background:#0b0f14;
      box-shadow: 0 10px 20px rgba(11,15,20,.10);
    }
    .lang button:hover{color:var(--text)}
    .hero{
      padding:34px 0 22px;
      display:grid;
      grid-template-columns: 1.25fr .75fr;
      gap:22px;
      align-items:stretch;
    }
    @media (max-width: 900px){
      .hero{grid-template-columns:1fr;gap:16px}
      .brand{min-width:auto}
      nav{display:none}
    }
    .card{
      background: #ffffff;
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .hero .left{padding:26px 24px}
    .eyebrow{
      display:inline-flex;align-items:center;gap:8px;
      padding:7px 10px;border-radius:999px;
      background:rgba(11,15,20,.06);
      border:1px solid rgba(11,15,20,.12);
      color:var(--text);
      font-size:12px;
    }
    .eyebrow .dot{width:8px;height:8px;border-radius:50%;background:#0b0f14;box-shadow:0 0 0 6px rgba(140,227,198,.10)}
    h1{margin:14px 0 10px;font-size:40px;letter-spacing:-.6px}
    @media (max-width: 560px){h1{font-size:32px}}
    .subtitle{color:var(--muted);font-size:16px;line-height:1.55;margin:0 0 18px}
    .pillrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
    .pill{
      padding:9px 12px;border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      color:var(--text);font-size:13px;
      display:flex;align-items:center;gap:8px;
    }
    .pill svg{opacity:.9}
    .hero .right{padding:18px;display:flex;flex-direction:column;gap:12px}
    .photoWrap{
      overflow:hidden;border-radius: 18px;border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      display:flex;align-items:center;justify-content:center;
      padding:12px;
    }
    .photoWrap img{width:100%;height:auto;border-radius:14px;display:block;max-height:340px;object-fit:cover}
    .quick{
      padding:16px 16px 14px;
      display:grid;grid-template-columns:1fr 1fr;gap:10px;
      background:rgba(11,15,20,.04);
      border:1px solid var(--line);
      border-radius:18px;
    }
    .qitem{padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
    .qitem b{display:block;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.2px}
    .qitem span{display:block;font-size:13px;margin-top:4px}
    section{margin-top:26px}
    .sectionHead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
    .sectionHead h2{margin:0;font-size:22px;letter-spacing:-.2px}
    .sectionHead p{margin:0;color:var(--muted);font-size:13px;max-width:55ch}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media (max-width: 900px){.grid2{grid-template-columns:1fr}}
    .pad{padding:18px}
    ul{margin:0;padding-left:18px;color:var(--text)}
    li{margin:7px 0;color:var(--text)}
    .muted{color:var(--muted)}
    /* Timeline */
    .timeline{position:relative;padding:18px}
    .timeline::before{
      content:"";position:absolute;left:28px;top:22px;bottom:22px;width:2px;
      background:linear-gradient(to bottom, rgba(140,227,198,.55), rgba(143,179,255,.45), rgba(255,255,255,.08));
      border-radius:10px;
    }
    .titem{position:relative;padding:12px 12px 12px 58px;border-radius:18px;cursor:pointer;transition:transform .18s ease, background .18s ease}
    .titem:hover{transform:translateY(-2px);background:rgba(255,255,255,.03)}
    .titem .dot{position:absolute;left:20px;top:18px;width:16px;height:16px;border-radius:50%;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      box-shadow: 0 0 0 6px rgba(140,227,198,.10);
    }
    .titem .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
    .titem .when{font-weight:700;font-size:13px}
    .titem .tag{font-size:12px;color:var(--muted)}
    .titem .desc{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.45;max-height:0;overflow:hidden;transition:max-height .28s ease}
    .titem[aria-expanded="true"] .desc{max-height:180px}
    .titem[aria-expanded="true"]{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
    .titem{border:1px solid transparent}
    /* Reviews */
    .reviews{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media (max-width: 900px){.reviews{grid-template-columns:1fr}}
    .review{padding:18px}
    .review .meta{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
    .review .meta b{font-size:13px}
    .review .meta span{font-size:12px;color:var(--muted)}
    .review p{margin:0;color:var(--text);line-height:1.6}
    .footer{
      margin-top:28px;
      padding:16px 18px;
      border-radius:18px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      color:var(--muted);
      font-size:12px;
      display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;
    }
    .cta{
      display:flex;gap:10px;flex-wrap:wrap;margin-top:14px
    }
    .btn{
      appearance:none;border:1px solid var(--line);cursor:pointer;
      padding:10px 12px;border-radius:999px;
      background:rgba(255,255,255,.03);
      color:var(--text);font-size:13px;
      transition:transform .18s ease, border-color .18s ease, background .18s ease;
      text-decoration:none;
      display:inline-flex;align-items:center;gap:8px
    }
    .btn:hover{transform:translateY(-1px);border-color:rgba(140,227,198,.35);background:rgba(140,227,198,.06)}
    .btn.primary{
      border-color:transparent;
      background: #0b0f14;
      color:#ffffff;
      font-weight:700;
    }
    .btn.primary:hover{background:#111827}
    .sr{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
  
    /* Active nav */
    nav a[aria-current="page"]{
      color:var(--text);
      border-color:rgba(140,227,198,.30);
      background:rgba(140,227,198,.06);
    }
          50%{transform:translate3d(30px,-18px,0) scale(1.06)}
    }

  
    /* Timeline tree */
    .edge{stroke: rgba(11,15,20,.14); stroke-width: 3; fill:none}
    .edgeGlow{stroke: rgba(11,15,20,.10); stroke-width: 10; fill:none; filter: blur(1px)}
    .node{cursor:pointer}
    .node circle{
      fill: rgba(255,255,255,.95);
      stroke: rgba(11,15,20,.18);
      stroke-width: 3;
      transition: transform .15s ease, stroke .15s ease, fill .15s ease;
    }
    .node text{
      fill: rgba(232,238,246,.92);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .2px;
      user-select:none;
      pointer-events:none;
    }
    .node .sub{
      fill: rgba(169,180,195,.95);
      font-size: 11px;
      font-weight: 600;
    }
    .node:hover circle{stroke: rgba(11,15,20,.45); fill: rgba(11,15,20,.03)}
    .node[aria-current="true"] circle{
      stroke: rgba(11,15,20,.65);
      fill: rgba(11,15,20,.04);
      transform: scale(1.03);
    }

  
    /* Vertical monochrome timeline */
    .vline{position:relative; padding:6px 0 6px 0; margin:0}
    .vitem{position:relative; display:grid; grid-template-columns:110px 1fr; gap:18px; padding:14px 0}
    .vitem .year{font-weight:800; letter-spacing:.2px; color:var(--text)}
    .vitem .title{font-weight:800; margin:0 0 4px; color:var(--text); font-size:14px}
    .vitem .desc{margin:0; color:var(--muted); line-height:1.6}
    .vitem::before{
      content:""; position:absolute; left:110px; top:0; bottom:0; width:2px;
      background: rgba(11,15,20,.18);
    }
    .vitem:first-child::before{top:20px}
    .vitem:last-child::before{bottom:20px}
    .vitem::after{
      content:""; position:absolute; left:110px; top:22px; width:12px; height:12px; border-radius:999px;
      background:#ffffff; border:2px solid rgba(11,15,20,.55);
      transform:translateX(-6px);
    }
    @media (max-width: 720px){
      .vitem{grid-template-columns:90px 1fr}
      .vitem::before{left:90px}
      .vitem::after{left:90px}
    }

  
  
        header{position:sticky; top:0; z-index:50; background:rgba(255,255,255,.92); backdrop-filter: blur(10px); border-bottom:1px solid var(--line);}
    .topbar{position:relative; z-index:1;}
    .btn.primary{background: linear-gradient(135deg, var(--accent), var(--accent2)); color:#ffffff;}
    .btn.primary:hover{background: linear-gradient(135deg, var(--accent2), var(--accent));}
    nav a:hover{border-color:rgba(26,166,184,.35); background:rgba(26,166,184,.06)}
    .pill{border-color:rgba(26,166,184,.30); background:rgba(26,166,184,.06)}
    .dot{background:rgba(26,166,184,.22); border:1px solid rgba(26,166,184,.28)}
    
  
    /* Centered header layout */
    .topbar2{
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 22px 10px;
      display:grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      gap: 10px 14px;
      align-items:center;
    }
    .brandCenter{justify-self:center; grid-column:1 / 3; grid-row:1}
    .lang{justify-self:end; grid-column:2; grid-row:1}
    .navRow{grid-column:1 / 3; grid-row:2; justify-self:center}
    .brand img{height:64px; width:auto}
    @media (max-width:720px){
      .topbar2{padding: 12px 14px 10px;}
      .brandCenter{justify-self:start; grid-column:1;}
      .lang{grid-column:2;}
      .navRow{justify-self:start; overflow:auto; white-space:nowrap}
      .brand img{height:56px}
    }
    
  
    /* Stronger palette presence (without covering header/logo) */
    body{
      background:
        radial-gradient(900px 520px at 20% 10%, rgba(29,111,214,.10), transparent 60%),
        radial-gradient(900px 520px at 85% 0%, rgba(26,166,184,.10), transparent 62%),
        radial-gradient(900px 520px at 55% 85%, rgba(185,100,69,.08), transparent 65%),
        var(--bg);
    }
    .card{
      border: 1px solid rgba(26,166,184,.16);
      box-shadow: var(--shadow);
    }
    .sectionHead h2{
      position:relative;
      display:inline-block;
    }
    .sectionHead h2::after{
      content:"";
      position:absolute;
      left:0;
      bottom:-10px;
      width:56%;
      height:3px;
      border-radius:999px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      opacity:.9;
    }
    .pill{
      background: linear-gradient(135deg, rgba(26,166,184,.10), rgba(29,111,214,.08));
      border-color: rgba(29,111,214,.22);
    }
    .btn{
      border-color: rgba(29,111,214,.22);
    }
    .btn.primary{
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color:#fff;
    }
    .btn.primary:hover{
      filter: brightness(0.98);
    }
    .btn:not(.primary):hover{
      background: rgba(26,166,184,.08);
      border-color: rgba(26,166,184,.28);
    }
    nav a[aria-current="page"]{
      border-color: rgba(26,166,184,.45);
      background: rgba(26,166,184,.08);
    }
    nav a:hover{border-color:rgba(26,166,184,.35); background:rgba(26,166,184,.06)}
    /* Timeline color accents */
    .vitem::before{
      background: linear-gradient(to bottom, rgba(29,111,214,.35), rgba(26,166,184,.35));
    }
    .vitem::after{
      background: #fff;
      border-color: rgba(29,111,214,.75);
      box-shadow: 0 0 0 3px rgba(29,111,214,.10);
    }
    .vbtn.active::after{
      border-color: rgba(26,166,184,.90);
      box-shadow: 0 0 0 4px rgba(26,166,184,.14);
    }
    .vbtn.active .title{
      color: var(--accent2);
    }

  
    /* Mobile logo sizing */
    @media (max-width:720px){
      .brand a{gap:10px;}
      .brand img{height:72px !important;}
      .name strong{font-size:18px; line-height:1.05;}
      .name span{line-height:1.05;}
    }
    
  
    .backHome{
      display:none;
      text-decoration:none;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(29,111,214,.22);
      background: rgba(26,166,184,.06);
      font-weight:700;
      font-size:13px;
      justify-self:start;
    }
    @media (max-width:720px){
      .backHome{display:inline-flex; align-items:center; gap:8px; grid-column:1; grid-row:1;}
      .lang{grid-row:1;}
      .brandCenter{grid-row:2; grid-column:1 / 3; justify-self:start;}
      .navRow{grid-row:3; grid-column:1 / 3;}
      .topbar2{grid-template-rows:auto auto auto;}
    }
    
  
    /* Mobile header tighten */
    @media (max-width:720px){
      header{border-bottom:1px solid var(--line);}
      .topbar2{padding: 10px 12px 8px; gap: 8px 10px;}
      .brandCenter{justify-self:start; align-self:center;}
      .brand a{gap:8px;}
      .brand img{height:70px !important;}
      .name strong{font-size:18px; line-height:1.0; margin:0}
      .name span{line-height:1.05;}
      /* remove extra vertical whitespace */
      .brand .name{margin-top:-2px;}
    }
    
  
    .midGlowReviews{
      position:fixed;
      left:50%;
      top:55%;
      transform:translate(-50%,-50%);
      width:min(1100px, 92vw);
      height:min(640px, 68vh);
      z-index:-1;
      background:
        radial-gradient(520px 360px at 22% 40%, rgba(26,166,184,.14), transparent 62%),
        radial-gradient(560px 380px at 78% 28%, rgba(29,111,214,.14), transparent 60%);
      pointer-events:none;
    }
    
  </style>
</head>
<body>
<header>
<div class="topbar topbar2">
    <div class="brand brandCenter" aria-label="Brand">
      <a href="index.html" style="display:flex;align-items:center;gap:14px;text-decoration:none">
        <img src="logo.png" alt="Rosalina Massage logo" />
        <div class="name">
          <strong>Rosalina Massage</strong>
          <span id="brandSub">Madi-Rosalina Vilà Geis</span>
        </div>
      </a>
    </div>

    <a class="backHome" id="backHome" href="index.html">← Home</a>

    <div class="lang" aria-label="Language switcher">
      <span class="sr">Language</span>
      <button type="button" data-lang="ca" aria-pressed="true">CA</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>

    <nav class="navRow" aria-label="Primary">
      <a href="index.html#about" id="navAbout">About</a>
      <a href="index.html#timeline" id="navTimeline">Timeline</a>
      <a href="index.html#services" id="navServices">Services</a>
      <a href="index.html#contact" id="navContact">Contact</a>
      <a href="reviews.html" id="navReviews" aria-current="page">Reviews</a>
    </nav>
  </div>
</header>

<main class="container">
  <div class="midGlowReviews" aria-hidden="true"></div>
  <section>
    <div class="sectionHead">
      <h2 id="reviewsTitle">Reviews</h2>
      <p id="reviewsHint">Aquí pots llegir totes les opinions.</p>
    </div>

    <div class="reviews" id="reviewsWrap"></div>

    <div class="footer">
      <div>© <span id="year"></span> Rosalina Massage</div>
      <div>Barcelona · ES/CA/FR/EN</div>
    </div>
  </section>
</main>

<script>
  const reviewsByLang = {
  "ca": [
    {
      "name": "Anònim",
      "date": "",
      "text": "Tinc 52 anys, soc psicòloga, rebirther, facilitadora de cercles de dones i professora de ioga terapèutic i oncològic. Ahir vaig rebre el primer massatge meravellós de la Madi. Només sentir les seves mans a l’esquena, la suavitat, el ritme i el moviment, vaig entendre que no era només un massatge físic... La seva cura, professionalitat, delicadesa i dedicació et relaxen completament i permeten que tot es posi al seu lloc. Com una pluja fina que nodreix a poc a poc una terra eixuta. Vaig notar especialment una obertura a la caixa toràcica i un alliberament subtil als malucs i a la zona pèlvica, sense ser-ne conscient abans que estiguessin limitats o bloquejats. He dormit de meravella i em sento més en pau i, alhora, més enfocada i amb més energia. Recomano al 100% els massatges de la Madi."
    },
    {
      "name": "Indrid",
      "date": "feb 2023",
      "text": "Tinc ganes de compartir la meva experiència amb els massatges que m’ha fet la Madi, perquè n’estic profundament agraïda. La primera vegada, durant el massatge, des de dins meu va sorgir un missatge molt important: \"tot està bé, no cal estar en alerta, no hi ha perill, pots relaxar-te, gaudir i descansar\". No sé com explicar com d’alliberador va ser sentir-ho! Va ser una experiència de pau i plenitud....\n\nEn aquell moment, la meva filla petita tenia 2 anys i continuava despertant-se moltes vegades i jo estava molt en alerta, sobretot de nit, com després del part. Un dels grans canvis va ser que les nits després del massatge vaig descansar completament i ja no em despertava. Alguna cosa profunda i molt antiga dins meu havia començat a relaxar-se.\n\nEn un altre moment, la sensació va ser de connexió i benestar.\n\nSento que els massatges de la Madi m’ajuden a connectar directament amb les meves cèl·lules, amb informació antiga enregistrada a la pell, amb experiències i records, i m’ajuden a alliberar i sanar d’una manera molt dolça i en pau. Gràcies, Madi!"
    }
  ],
  "es": [
    {
      "name": "Anónimo",
      "date": "",
      "text": "Tengo 52 años, soy psicóloga, rebirther, facilitadora de círculos de mujeres y profesora de yoga terapéutico y oncológico. Ayer recibí el primer masaje maravilloso de Madi. En cuanto sentí sus manos en mi espalda, la suavidad, el ritmo y el movimiento, comprendí que no era solo un masaje físico... Su cuidado, profesionalidad, delicadeza y dedicación te relajan por completo y permiten que todo se coloque en su sitio. Como una lluvia fina que nutre lentamente la tierra seca. Noté especialmente una apertura en mi caja torácica y una liberación sutil en las caderas y la zona pélvica, sin haber sido consciente antes de que estuvieran limitadas o bloqueadas. He dormido de maravilla y me siento más en paz y, al mismo tiempo, más enfocada y con más energía. ¡Recomiendo al 100% los masajes de Madi!"
    },
    {

  function setActiveLangButton(lang){
    document.querySelectorAll(".lang button").forEach(b=>{
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    });
  }

  function renderReviews(lang){
    const wrap = document.getElementById("reviewsWrap");
    wrap.innerHTML = "";
    (reviewsByLang[lang] || reviewsByLang.ca).forEach(r=>{
      const card = document.createElement("div");
      card.className = "card review";
      card.innerHTML = `
        <div class="meta">
          <b>${r.name}</b>
          <span>${r.date}</span>
        </div>
        <p>${r.text.replace(/\n/g,"<br>")}</p>
      `;
      wrap.appendChild(card);
    });
  }

  function applyLang(lang){
    const t = i18n[lang] || i18n.ca;
    document.documentElement.lang = lang;
    document.getElementById("navAbout").textContent = t.nav.about;
    document.getElementById("navTimeline").textContent = t.nav.timeline;
    document.getElementById("navServices").textContent = t.nav.services;
    document.getElementById("navContact").textContent = t.nav.contact;

    document.getElementById("reviewsTitle").textContent = t.reviews.title;
    document.getElementById("reviewsHint").textContent = t.reviews.hint;
    renderReviews(lang);

    localStorage.setItem("rosalina_lang", lang);
    setActiveLangButton(lang);
  }

  document.querySelectorAll(".lang button").forEach(btn=>{
